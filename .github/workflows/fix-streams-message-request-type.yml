name: Fix Streams message request type

on:
  push:
    paths:
      - ".github/workflows/fix-streams-message-request-type.yml"

permissions:
  contents: write

jobs:
  fix-type:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add messages and context fields
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/app/api/streams-ai/messages/route.ts")
          source = path.read_text()
          old = '  message?: string;\n  attachments?: any[];'
          new = '  message?: string;\n  messages?: Array<{ role?: string; content?: unknown }>;\n  context?: Record<string, unknown>;\n  attachments?: any[];'
          if old not in source:
              raise SystemExit("Expected StreamsMessageRequestBody fields not found")
          path.write_text(source.replace(old, new, 1))

      - name: Commit type fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/streams-ai/messages/route.ts
          git diff --cached --check
          git commit -m "Fix Streams message request body type"
          git push
