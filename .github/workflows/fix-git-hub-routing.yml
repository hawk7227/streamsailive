name: Fix spaced GitHub routing

on:
  push:
    paths:
      - ".github/workflows/fix-git-hub-routing.yml"

permissions:
  contents: write

jobs:
  fix-routing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Recognize git hub as tool intent
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/app/api/streams-ai/messages/route.ts")
          source = path.read_text()
          old = r'git(?:hub|\s*gib)?'
          new = r'git(?:\s*hub|\s*gib)?'
          if old not in source:
              raise SystemExit("Expected GitHub intent regex not found")
          path.write_text(source.replace(old, new, 1))

      - name: Commit routing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/streams-ai/messages/route.ts
          git diff --cached --check
          git commit -m "Route spaced GitHub intent through assistant tools"
          git push

