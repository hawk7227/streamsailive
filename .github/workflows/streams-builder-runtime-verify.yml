name: streams-builder-runtime-verify

on:
  pull_request:
    paths:
      - 'src/lib/streams-builder/**'
      - 'src/app/api/streams-builder/**'
      - 'tests/streams-builder-*.test.ts'
      - '.github/workflows/streams-builder-runtime-verify.yml'

jobs:
  runtime-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture TypeScript diagnostics
        id: typecheck
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > tsc-diagnostics.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: streams-builder-tsc-diagnostics
          path: tsc-diagnostics.txt
          if-no-files-found: error
      - name: Enforce TypeScript result
        run: test "${{ steps.typecheck.outputs.exit_code }}" = "0"

  runtime-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm vitest run
          tests/streams-builder-repository-intelligence.test.ts
          tests/streams-builder-repository-graph.test.ts
          tests/streams-builder-durable-orchestrator.test.ts
          tests/streams-builder-production-runtime-services.test.ts
          tests/streams-builder-runtime-stage-executor.test.ts
          tests/streams-builder-runtime-load-benchmark.test.ts
          src/lib/streams-builder/__tests__/browser-observation-runtime.test.ts
