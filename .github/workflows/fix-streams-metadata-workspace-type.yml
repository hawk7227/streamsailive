name: Fix Streams metadata workspace type

on:
  push:
    paths:
      - ".github/workflows/fix-streams-metadata-workspace-type.yml"

permissions:
  contents: write

jobs:
  fix-type:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use typed body workspace fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/app/api/streams-ai/messages/route.ts")
          source = path.read_text()
          old = '          workspaceId: authoritativeBody.workspaceId || authoritativeBody.metadata?.workspaceId || undefined,'
          new = '          workspaceId: authoritativeBody.workspaceId || body.metadata?.workspaceId || undefined,'
          if old not in source:
              raise SystemExit("Expected workspaceId context mapping not found")
          path.write_text(source.replace(old, new, 1))

      - name: Commit type fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/streams-ai/messages/route.ts
          git diff --cached --check
          git commit -m "Fix Streams metadata workspace type"
          git push

