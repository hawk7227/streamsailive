          insertion = '''
  async function revokeSessions(action: "user" | "all") {
    if (action === "all" && !window.confirm("Sign out every user from every active browser session?")) return;
    if (action === "user" && !targetUser.trim()) { setError("Enter a user email or user ID"); return; }
    setLoading(true); setError(""); setRevocationMessage("");
    try {
      const target = targetUser.trim();
      const response = await fetch("/api/admin/session-revocations", {
        method: "POST", credentials: "include", headers: { "content-type": "application/json" },
        body: JSON.stringify({ action, ...(action === "user" ? (target.includes("@") ? { email: target } : { userId: target }) : {}), reason: "Administrator operation" }),
      });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "Session revocation failed");
      setRevocationMessage(action === "all" ? "Every active user session has been revoked." : "The selected user session has been revoked.");
    } catch (caught) { setError(caught instanceof Error ? caught.message : "Session revocation failed"); }
    finally { setLoading(false); }
  }
'''
