name: Add global session revocation

on:
  push:
    paths:
      - ".github/workflows/add-global-session-revocation.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add session revocation controls
        shell: python
        run: |
          from pathlib import Path

          migration = Path("supabase/migrations/20260729120000_admin_session_revocations.sql")
          migration.parent.mkdir(parents=True, exist_ok=True)
          migration.write_text('''create table if not exists public.admin_session_revocations (
            id uuid primary key default gen_random_uuid(),
            scope text not null check (scope in ('user', 'all')),
            target_user_id uuid null,
            issued_before timestamptz not null default now(),
            created_by uuid not null,
            created_at timestamptz not null default now(),
            reason text null
          );

          create index if not exists admin_session_revocations_scope_created_idx
            on public.admin_session_revocations (scope, created_at desc);
          create index if not exists admin_session_revocations_target_created_idx
            on public.admin_session_revocations (target_user_id, created_at desc);

          alter table public.admin_session_revocations enable row level security;
          revoke all on public.admin_session_revocations from anon, authenticated;
''')

          admin_route = Path("src/app/api/admin/session-revocations/route.ts")
          admin_route.parent.mkdir(parents=True, exist_ok=True)
          admin_route.write_text('''import { NextRequest, NextResponse } from "next/server";
import { createAdminClient } from "@/lib/supabase/admin";
import { isAdminAuthorizationError, requireAdminSession } from "@/lib/admin/require-admin-session";

export const runtime = "nodejs";
export const dynamic = "force-dynamic";

type Body = { action?: "user" | "all"; userId?: string; email?: string; reason?: string };

export async function POST(request: NextRequest) {
  try {
    const administrator = await requireAdminSession();
    const body = (await request.json().catch(() => ({}))) as Body;
    const action = body.action;
    if (action !== "user" && action !== "all") {
      return NextResponse.json({ ok: false, error: "action must be user or all" }, { status: 400 });
    }

    const admin = createAdminClient();
    let targetUserId: string | null = null;
    if (action === "user") {
      targetUserId = String(body.userId || "").trim() || null;
      if (!targetUserId && body.email) {
        const { data, error } = await admin.from("profiles").select("id").ilike("email", String(body.email).trim()).limit(1).maybeSingle();
        if (error) throw error;
        targetUserId = data?.id || null;
      }
      if (!targetUserId) return NextResponse.json({ ok: false, error: "A valid userId or email is required" }, { status: 400 });
    }

    const issuedBefore = new Date().toISOString();
    const { data, error } = await admin.from("admin_session_revocations").insert({
      scope: action,
      target_user_id: targetUserId,
      issued_before: issuedBefore,
      created_by: administrator.userId,
      reason: String(body.reason || "Administrator forced sign out").slice(0, 500),
    }).select("id, scope, target_user_id, issued_before, created_at").single();
    if (error) throw error;

    console.warn("ADMIN_SESSION_REVOCATION", {
      administratorId: administrator.userId,
      administratorEmail: administrator.email,
      workspaceId: administrator.workspaceId,
      action,
      targetUserId,
      issuedBefore,
    });

    return NextResponse.json({ ok: true, revocation: data });
  } catch (error) {
    if (isAdminAuthorizationError(error)) {
      return NextResponse.json({ ok: false, error: error.message }, { status: error.status });
    }
    return NextResponse.json({ ok: false, error: error instanceof Error ? error.message : "Unable to revoke sessions" }, { status: 500 });
  }
}
''')

          status_route = Path("src/app/api/auth/session-status/route.ts")
          status_route.parent.mkdir(parents=True, exist_ok=True)
          status_route.write_text('''import { NextResponse } from "next/server";
import { createClient } from "@/lib/supabase/server";
import { createAdminClient } from "@/lib/supabase/admin";

export const runtime = "nodejs";
export const dynamic = "force-dynamic";

function jwtIssuedAt(accessToken: string | undefined) {
  try {
    if (!accessToken) return 0;
    const payload = JSON.parse(Buffer.from(accessToken.split(".")[1] || "", "base64url").toString("utf8"));
    return Number(payload?.iat || 0) * 1000;
  } catch { return 0; }
}

function isAnonymous(user: any) {
  const provider = String(user?.app_metadata?.provider || "").toLowerCase();
  const providers = Array.isArray(user?.app_metadata?.providers) ? user.app_metadata.providers.map((value: unknown) => String(value).toLowerCase()) : [];
  return user?.is_anonymous === true || provider === "anonymous" || providers.includes("anonymous");
}

export async function GET() {
  const supabase = await createClient();
  const [{ data: userData, error: userError }, { data: sessionData }] = await Promise.all([
    supabase.auth.getUser(),
    supabase.auth.getSession(),
  ]);
  const user = userData.user;
  if (userError || !user || isAnonymous(user)) {
    return NextResponse.json({ ok: false, authenticated: false, reason: "sign_in_required" }, { status: 401 });
  }

  const admin = createAdminClient();
  const { data, error } = await admin.from("admin_session_revocations")
    .select("scope, target_user_id, issued_before")
    .or(`scope.eq.all,target_user_id.eq.${user.id}`)
    .order("issued_before", { ascending: false })
    .limit(1);
  if (error) throw error;

  const issuedAt = jwtIssuedAt(sessionData.session?.access_token);
  const cutoff = Array.isArray(data) && data[0]?.issued_before ? new Date(data[0].issued_before).getTime() : 0;
  if (!issuedAt || (cutoff && issuedAt <= cutoff)) {
    return NextResponse.json({ ok: false, authenticated: false, reason: "session_revoked" }, { status: 401 });
  }

  return NextResponse.json({ ok: true, authenticated: true, userId: user.id });
}
''')

