    if (!session || !user || isAnonymousAuthUser(user)) return;
    let cancelled = false;
    const verify = async () => {
      try {
        const response = await fetch("/api/auth/session-status", { credentials: "include", cache: "no-store" });
        if (!cancelled && response.status === 401) {
          clearAccountScopedBrowserState();
          await supabase.auth.signOut();
          setSession(null);
          setUser(null);
          resetSignedOutState();
          router.replace("/login?reason=session-ended");
          router.refresh();
        }
      } catch {}
    };
    void verify();
    const timer = window.setInterval(verify, 30000);
    return () => { cancelled = true; window.clearInterval(timer); };
  }, [session, user, supabase.auth, resetSignedOutState, router]);

'''
